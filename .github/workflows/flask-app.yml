# Minty (the Flask monolith): ruff and the whole pytest suite on Postgres.
#
# A file of its own rather than an input on python-api.yml, because almost nothing is shared:
# Minty installs with uv (not pip), runs on Python 3.11 (not 3.13), has NO SQLite mode at all
# (tests/pg_harness.py: Postgres is the only mode since phase C10), and runs under pytest-xdist
# with one Postgres build per worker.
#
# It DOES need the three API repos beside it, which the first real run proved (2026-10-09):
# tests/test_zz_schema_audit.py runs docs/schema/generators/audit_models.py across all four
# repos and compares every model against the built schema, so with only Minty checked out it
# reported "3 REPO(S) NOT FOUND" and exited 1. That audit is the thing that catches a mirror
# drifting from 01_schema_rebased.sql, so skipping it would remove the point of the job.
# It passes locally only because the repos are siblings in C:\Github - the exact class of bug
# a first CI run exists to find.
#
# So everything is checked out as siblings UNDER the workspace: Minty at <workspace>/Minty and
# each API beside it, which is the layout audit_models.py expects (MINTY_REPOS_ROOT, else the
# parent of this checkout). No token: all four repos are public as of 2026-10-09.
#
# Retires with Flask (modernisation plan, Part 3 step 7).
#
# Callers pin a tag, never @main:
#   uses: minty-oliveandvine/.github/.github/workflows/flask-app.yml@v1
name: flask-app

on:
  workflow_call:
    inputs:
      python-version:
        description: "Minty pins >=3.11,<3.12 in pyproject.toml."
        type: string
        default: "3.11"

jobs:
  test:
    runs-on: ubuntu-latest
    # Everything runs inside the Minty checkout; the API repos sit beside it, unused except by
    # the cross-repo schema audit.
    defaults:
      run:
        working-directory: Minty
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          path: Minty

      # Beside Minty, for tests/test_zz_schema_audit.py only. Public repos, so no token; a full
      # checkout rather than a sparse one because the audit walks each repo's models and a
      # sparse path list would rot the first time a model moved.
      - uses: actions/checkout@v7
        with:
          repository: minty-oliveandvine/minty-subscription-api
          path: minty-subscription-api
      - uses: actions/checkout@v7
        with:
          repository: minty-oliveandvine/minty-payment-request-api
          path: minty-payment-request-api
      - uses: actions/checkout@v7
        with:
          repository: minty-oliveandvine/minty-onboarding-api
          path: minty-onboarding-api

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}

      # uv through pip, exactly as Minty's own migrate.yml installs it - no third-party action
      # for something one line of pip already does. --no-install-project is migrate.yml's too:
      # the tests import from the repo root, so the project itself is never built. The dev group
      # (ruff, pytest, pytest-xdist) comes with the sync.
      - name: uv, then the dependencies
        run: |
          pip install uv
          uv sync --frozen --no-install-project

      - name: ruff
        run: uv run ruff check .

      # psql is how pg_harness.py runs the schema file; PG_BIN stops its Windows-shaped
      # fallback (C:\Program Files\PostgreSQL\*\bin) from being reached at all.
      - name: the psql client
        run: sudo apt-get install -y --no-install-recommends postgresql-client

      - name: pytest (Postgres from 01_schema_rebased.sql)
        env:
          MINTY_TEST_PG_URI: postgresql://postgres:postgres@localhost:5432/postgres
          # A database of its own per run; each xdist worker appends its own suffix.
          MINTY_TEST_PG_DBNAME: ci_${{ github.run_id }}_${{ github.run_attempt }}
          PG_BIN: /usr/bin
          # Where the four repos sit. audit_models.py would otherwise fall back to the parent of
          # this checkout, which is the same folder here - set explicitly so the layout is a
          # stated contract rather than a coincidence of the checkout path.
          MINTY_REPOS_ROOT: ${{ github.workspace }}
        run: uv run pytest -n auto -q
