# The three Django APIs: ruff, then pytest twice - once on SQLite (the service's own logic),
# once on a Postgres built from Minty's docs/schema/01_schema_rebased.sql (do the mirrors still
# match the real schema?). Lifted from minty-subscription-api's day-one workflow, which is where
# both passes were worked out.
#
# The Postgres pass builds its database from the schema file. A branch that pins minty-db
# (requirements.txt: `minty-db @ ...`; every API's main/development since 2026-11-03) gets it from
# that package (minty_db.testing.pg) and needs no Minty checkout. Any other branch (the APIs'
# `redesign`) still loads Minty/tests/pg_harness.py by path from MINTY_REPO, so Minty is checked
# out beside it - only for those.
#
# Callers pin a tag, never @main:
#   uses: minty-oliveandvine/.github/.github/workflows/python-api.yml@v1
name: python-api

on:
  workflow_call:
    inputs:
      python-version:
        description: "3.13 for minty-subscription-api; 3.11 for payment-request and onboarding."
        type: string
        required: true
      schema-name-test:
        description: >-
          A pytest path run once more against ?schema=pettycash_alt, proving the schema name is a
          setting and not a literal. Empty skips the step.
        type: string
        default: ""
    secrets:
      MINTY_READ_TOKEN:
        description: >-
          No longer used: minty-oliveandvine/Minty is public as of 2026-10-09, so the checkout
          below authenticates with nothing. Kept declared, and OPTIONAL, only so the callers that
          still pass it keep validating - a caller passing an undeclared secret is a hard error.
          Drop it from the three API repos' ci.yml, then delete this block.
        required: false

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7

      # Where the test database comes from: minty-db when the branch pins it, else Minty's harness.
      - name: Test database source
        id: harness
        run: |
          if grep -qE '^minty-db @ ' requirements.txt; then
            echo "from=minty-db" >> "$GITHUB_OUTPUT"
            echo "requirements.txt pins minty-db: the test database comes from it; no Minty checkout."
          else
            echo "from=minty" >> "$GITHUB_OUTPUT"
            echo "No minty-db pin: Minty is checked out for tests/pg_harness.py."
          fi

      # The Postgres test mode (without minty-db) loads Minty/tests/pg_harness.py and builds the schema from
      # Minty/docs/schema/01_schema_rebased.sql - so Minty is checked out beside this repo.
      # No token: Minty is public as of 2026-10-09, the same reason flask-app.yml needs none.
      # There used to be a guard step here refusing an empty MINTY_READ_TOKEN; it was the first
      # thing this workflow ever ran, and it failed every run because no API repo had the secret.
      # Minty's branch follows the caller's (a PR's base, else the pushed branch): with no ref the
      # checkout took Minty's default branch, main, so an API on development was tested against a
      # schema it had already moved past (payer_user_id NOT NULL, 2026-10-12).
      # A branch Minty does not have (the app repos' `redesign`, 2026-10-28) takes Minty's main.
      # The harness loads services/app_runtime/env.py by path (stdlib only), so it comes too.
      - name: Minty branch
        id: minty
        if: steps.harness.outputs.from == 'minty'
        env:
          WANT: ${{ github.base_ref || github.ref_name }}
        run: |
          set +e
          git ls-remote --exit-code --heads https://github.com/minty-oliveandvine/Minty.git "refs/heads/$WANT" >/dev/null
          rc=$?
          set -e
          case $rc in
            0) ref=$WANT ;;
            2) ref=main; echo "Minty has no branch '$WANT'; using main." ;;
            *) echo "::error::git ls-remote on Minty failed (exit $rc)"; exit 1 ;;
          esac
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        if: steps.harness.outputs.from == 'minty'
        with:
          repository: minty-oliveandvine/Minty
          ref: ${{ steps.minty.outputs.ref }}
          path: Minty
          sparse-checkout: |
            tests/pg_harness.py
            services/app_runtime/env.py
            docs/schema/01_schema_rebased.sql
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip

      - run: pip install -r requirements.txt

      - name: ruff
        run: ruff check .

      - name: pytest (SQLite)
        run: pytest -q

      - name: pytest (Postgres from 01_schema_rebased.sql)
        env:
          MINTY_TEST_PG_URI: postgresql://postgres:postgres@localhost:5432/postgres
          # A database of its own per run, never the shared default name.
          MINTY_TEST_PG_DBNAME: ci_${{ github.run_id }}_${{ github.run_attempt }}
          MINTY_REPO: ${{ github.workspace }}/Minty
          PG_BIN: /usr/bin
        run: |
          sudo apt-get install -y --no-install-recommends postgresql-client
          pytest -q

      - name: the schema name is a setting, not a literal
        if: inputs.schema-name-test != ''
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres?schema=pettycash_alt
          SCHEMA_NAME_TEST: ${{ inputs.schema-name-test }}
        run: pytest -q "$SCHEMA_NAME_TEST"
