# The three Django APIs: ruff, then pytest twice - once on SQLite (the service's own logic),
# once on a Postgres built from Minty's docs/schema/01_schema_rebased.sql (do the mirrors still
# match the real schema?). Lifted from minty-subscription-api's day-one workflow, which is where
# both passes were worked out.
#
# The repos' conftest.py files are byte-identical: with MINTY_TEST_PG_URI set they load
# Minty/tests/pg_harness.py by path from MINTY_REPO, so Minty is checked out beside the caller.
#
# Callers pin a tag, never @main:
#   uses: minty-oliveandvine/.github/.github/workflows/python-api.yml@v1
name: python-api

on:
  workflow_call:
    inputs:
      python-version:
        description: "3.13 for minty-subscription-api; 3.11 for payment-request and onboarding."
        type: string
        required: true
      schema-name-test:
        description: >-
          A pytest path run once more against ?schema=pettycash_alt, proving the schema name is a
          setting and not a literal. Empty skips the step.
        type: string
        default: ""
    secrets:
      MINTY_READ_TOKEN:
        description: >-
          No longer used: minty-oliveandvine/Minty is public as of 2026-10-09, so the checkout
          below authenticates with nothing. Kept declared, and OPTIONAL, only so the callers that
          still pass it keep validating - a caller passing an undeclared secret is a hard error.
          Drop it from the three API repos' ci.yml, then delete this block.
        required: false

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7

      # The Postgres test mode loads Minty/tests/pg_harness.py and builds the schema from
      # Minty/docs/schema/01_schema_rebased.sql - so Minty is checked out beside this repo.
      # No token: Minty is public as of 2026-10-09, the same reason flask-app.yml needs none.
      # There used to be a guard step here refusing an empty MINTY_READ_TOKEN; it was the first
      # thing this workflow ever ran, and it failed every run because no API repo had the secret.
      - uses: actions/checkout@v7
        with:
          repository: minty-oliveandvine/Minty
          path: Minty
          sparse-checkout: |
            tests/pg_harness.py
            docs/schema/01_schema_rebased.sql
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip

      - run: pip install -r requirements.txt

      - name: ruff
        run: ruff check .

      - name: pytest (SQLite)
        run: pytest -q

      - name: pytest (Postgres from 01_schema_rebased.sql)
        env:
          MINTY_TEST_PG_URI: postgresql://postgres:postgres@localhost:5432/postgres
          # A database of its own per run, never the shared default name.
          MINTY_TEST_PG_DBNAME: ci_${{ github.run_id }}_${{ github.run_attempt }}
          MINTY_REPO: ${{ github.workspace }}/Minty
          PG_BIN: /usr/bin
        run: |
          sudo apt-get install -y --no-install-recommends postgresql-client
          pytest -q

      - name: the schema name is a setting, not a literal
        if: inputs.schema-name-test != ''
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres?schema=pettycash_alt
          SCHEMA_NAME_TEST: ${{ inputs.schema-name-test }}
        run: pytest -q "$SCHEMA_NAME_TEST"
